<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · Exam Seating Planner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-wrap">
    <div class="card login-card">
      <h1>Exam Seating Planner</h1>
      <p class="muted">Log in with your email (staff) or student code.</p>
      <div id="msg"></div>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="identifier">Email or student code</label>
          <input id="identifier" name="identifier" autocomplete="username" required maxlength="120">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="72">
        </div>
        <button type="submit" id="submit">Log in</button>
      </form>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
