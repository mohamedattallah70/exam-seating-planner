<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · Exam Seating Planner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <div class="page-head">
      <div><h1 id="greeting">Dashboard</h1><p class="muted" id="sub"></p></div>
    </div>
    <div class="grid" id="cards"></div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script>
    (async () => {
      const user = await ESP.initPage();
      document.getElementById('greeting').textContent = `Welcome, ${user.name}`;
      const cards = {
        admin: [
          ['halls.html', 'Halls & seat layouts', 'Create halls, edit seat grids and block seats.'],
          ['exams.html', 'Exams & rosters', 'Schedule exams, import student rosters, assign proctors.'],
          ['allocation.html', 'Seat allocation', 'Run, adjust and publish seating plans.'],
        ],
        proctor: [
          ['exams.html', 'My exams', 'Exams and halls you supervise.'],
          ['seat-map.html', 'Seat maps', 'Print the up-to-date plan for your hall.'],
        ],
        student: [['my-seat.html', 'My seat', 'Your hall, row and seat for each upcoming exam.']],
      }[user.role] || [];
      document.getElementById('sub').textContent = `Signed in as ${user.role}`;
      document.getElementById('cards').replaceChildren(...cards.map(([href, title, text]) =>
        ESP.el('a', { href, class: 'card', style: 'text-decoration:none;color:inherit' }, ESP.el('h2', {}, title), ESP.el('p', { class: 'muted' }, text))));
    })();
  </script>
</body>
</html>
