<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seat map · Exam Seating Planner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <div id="page-msg"></div>

    <!-- proctor: list of assigned halls (shown when no exam/hall is given) -->
    <section class="card hidden" id="list-card">
      <h1>My halls</h1>
      <p class="muted">Halls you supervise. Seat maps open once the plan is published.</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Exam</th><th>When</th><th>Hall</th><th>Seat map</th></tr></thead>
        <tbody id="hall-rows"></tbody>
      </table></div>
    </section>

    <!-- one hall's printable seat map -->
    <section class="card hidden" id="map-card">
      <div class="page-head" style="margin:0">
        <div><h1 id="map-title"></h1><p id="map-details" class="muted"></p></div>
        <button id="print" type="button" class="no-print">Print / Save as PDF</button>
      </div>
      <div class="front">FRONT (exam desk)</div>
      <div id="seat-grid" class="seat-grid"></div>
      <div class="legend"><span class="l-free">Free</span><span class="l-taken">Student</span><span class="l-blocked">Blocked</span></div>
    </section>
    <section class="card hidden print-break" id="att-card">
      <h2>Attendance list (by student code)</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>Student code</th><th>Name</th><th>Seat</th><th style="width:35%">Signature</th></tr></thead>
        <tbody id="list-rows"></tbody>
      </table></div>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/seat-map.js"></script>
</body>
</html>
