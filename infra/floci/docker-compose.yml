# Floci: local AWS emulator (https://floci.io) — same setup as Lab 8.
#   Start:   docker compose -f infra/floci/docker-compose.yml up -d
#   Console: http://localhost:4566/_floci/ui
#   Stop:    docker compose -f infra/floci/docker-compose.yml down   (data is kept)
name: exam-seating-planner

services:
  floci:
    image: floci/floci:latest
    container_name: esp-floci
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_UI_BIND_ADDRESS: "127.0.0.1"
      FLOCI_BASE_URL: http://floci:4566
      FLOCI_SERVICES_UI_IMAGE: ghcr.io/ofsazib/floci-dash:latest
      FLOCI_SERVICES_UI_CONTAINER_NAME: floci-dash
      FLOCI_SERVICES_UI_ENDPOINT_ENV: FLOCI_URL
      FLOCI_SERVICES_UI_STATUS_PATH: /api/healthz
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  floci-data:
